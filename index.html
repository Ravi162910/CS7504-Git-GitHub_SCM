<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Changing Background Color</title>
    <style>
        body {
            background-color: red;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        code {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Changing the Background Color</h1>

    <p>To change the background color of a webpage using CSS, set the <code>background-color</code> property inside the <code>body</code> selector.</p>

    <p>For example, using <code>background-color: red;</code> in your CSS block changes the webpage background to red.</p>

</body>
</html>
