<!DOCTYPE html>
<html>
<head>
    <title>Changing Background Colour</title>

    <style>
        body {
            background-color: red;
        }
    </style>
</head>

<body>

    <h1>Changing the Background Colour</h1>

    <p>
        The background colour of a webpage can be changed using CSS.
        In the body section, the property
        <b>background-color</b> is used.
    </p>

    <p>
        For example: background-color: red;
        changes the background of the webpage to red.
    </p>

</body>
</html>
